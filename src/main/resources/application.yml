server:
  port: 8000

spring:
  application:
    name: tacticalplay-rag
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/tacticalplay}
    username: ${POSTGRES_USER:tactical_user}
    password: ${POSTGRES_PASSWORD:tactical_password}
    driver-class-name: org.postgresql.Driver
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB

ai:
  gemini:
    api-key: ${GEMINI_API_KEY:}
    embedding-model: ${GEMINI_EMBEDDING_MODEL:gemini-embedding-001}
    chat-model: ${GEMINI_CHAT_MODEL:gemini-3.1-flash-lite}
  embedding:
    dimensions: 768
